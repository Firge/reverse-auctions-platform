name: Build and Push Docker Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      changed_services: ${{ steps.matrix.outputs.changed_services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            tools:
              - 'tools/**'
              - 'Dockerfile.tools'
            smtp_worker:
              - 'smtp/service/**'
            smtp_relay:
              - 'smtp/postfix/**'

      - name: Build matrix from changed services
        id: matrix
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          TOOLS: ${{ steps.filter.outputs.tools }}
          SMTP_WORKER: ${{ steps.filter.outputs.smtp_worker }}
          SMTP_RELAY: ${{ steps.filter.outputs.smtp_relay }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          targets = []
          changed = []
          mapping = [
              ("backend", "BACKEND"),
              ("frontend", "FRONTEND"),
              ("tools", "TOOLS"),
              ("smtp-worker", "SMTP_WORKER"),
              ("smtp-relay", "SMTP_RELAY"),
          ]
          for target_name, env_name in mapping:
              if os.environ.get(env_name) == "true":
                  changed.append(target_name)
                  targets.append({"target": target_name})

          print(f"has_changes={'true' if targets else 'false'}")
          print(f"matrix={json.dumps({'include': targets})}")
          print(f"changed_services={','.join(changed)}")
          PY

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image namespace
        id: prep
        run: echo "image_namespace=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build target with bake
        uses: docker/bake-action@v5
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ steps.prep.outputs.image_namespace }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          files: |
            docker-compose.build.hcl
          targets: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}

      - name: Build summary
        run: |
          echo "Built target: ${{ matrix.target }}"

  no-op:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_changes != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: No changes to build
        run: |
          echo "No service changes detected. Skipping image build."
