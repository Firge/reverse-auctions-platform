name: Deploy To Production

on:
  workflow_run:
    workflows: ["Build and Push Docker Artifacts"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_SLUG: ${{ github.repository }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image namespace
        id: prep
        run: echo "image_namespace=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAMESPACE: ${{ steps.prep.outputs.image_namespace }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_USERNAME: ${{ env.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ env.GHCR_TOKEN }}
          REPO_SLUG: ${{ env.REPO_SLUG }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          ENV_PROD_SOURCE_PATH: ${{ secrets.VPS_ENV_PROD_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 120m
          envs: IMAGE_NAMESPACE,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,REPO_SLUG,DEPLOY_PATH,ENV_PROD_SOURCE_PATH
          script_stop: true
          script: |
            set -eu
            echo "[deploy] script started"

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "VPS_DEPLOY_PATH is empty"
              exit 1
            fi

            if [ -z "${ENV_PROD_SOURCE_PATH:-}" ]; then
              echo "VPS_ENV_PROD_PATH is empty"
              exit 1
            fi

            if [ ! -f "$ENV_PROD_SOURCE_PATH" ]; then
              echo "Source env file not found: $ENV_PROD_SOURCE_PATH"
              exit 1
            fi
            echo "[deploy] env paths validated"

            REPO_URL="https://x-access-token:${GHCR_TOKEN}@github.com/${REPO_SLUG}.git"
            echo "[deploy] repo URL prepared"

            DEPLOY_PARENT="$(dirname "$DEPLOY_PATH")"
            mkdir -p "$DEPLOY_PARENT"
            echo "[deploy] deploy parent ensured: $DEPLOY_PARENT"

            if [ -d "$DEPLOY_PATH/.git" ]; then
              echo "[deploy] existing git repo found, fetching"
              if git -C "$DEPLOY_PATH" remote get-url origin >/dev/null 2>&1; then
                git -C "$DEPLOY_PATH" remote set-url origin "$REPO_URL"
              else
                git -C "$DEPLOY_PATH" remote add origin "$REPO_URL"
              fi
              git -C "$DEPLOY_PATH" fetch --depth 1 origin main
              git -C "$DEPLOY_PATH" checkout -B main FETCH_HEAD
            else
              echo "[deploy] cloning fresh repo"
              git clone --depth 1 --branch main "$REPO_URL" "$DEPLOY_PATH"
            fi
            echo "[deploy] repository ready"

            cp "$ENV_PROD_SOURCE_PATH" "$DEPLOY_PATH/.env.prod"
            echo "[deploy] .env.prod copied"

            cd "$DEPLOY_PATH"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            echo "[deploy] docker login ok"

            export IMAGE_REGISTRY=ghcr.io
            export IMAGE_NAMESPACE="$IMAGE_NAMESPACE"
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose --env-file .env.prod -f docker-compose.prod.yaml pull
            echo "[deploy] images pulled"

            docker compose --env-file .env.prod -f docker-compose.prod.yaml up -d postgres redis
            echo "[deploy] postgres/redis started"

            DB_USER="$(grep -E '^POSTGRES_USER=' .env.prod | tail -n1 | cut -d= -f2-)"
            DB_NAME="$(grep -E '^POSTGRES_DB=' .env.prod | tail -n1 | cut -d= -f2-)"
            if [ -z "$DB_USER" ]; then DB_USER="catalog"; fi
            if [ -z "$DB_NAME" ]; then DB_NAME="catalog"; fi

            CATALOG_READY="$(docker compose --env-file .env.prod -f docker-compose.prod.yaml exec -T postgres \
              psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = 'catalog_items') AND (SELECT COUNT(*) FROM catalog_items) > 0 THEN 1 ELSE 0 END;")"

            if [ "$CATALOG_READY" = "1" ]; then
              echo "Catalog already exists in DB. Skipping init-catalog."
            else
              echo "Catalog not found or empty. Running init-catalog."
              docker compose --env-file .env.prod -f docker-compose.prod.yaml run --rm init-catalog
            fi

            docker compose --env-file .env.prod -f docker-compose.prod.yaml up -d
            echo "[deploy] services updated"

            docker compose --env-file .env.prod -f docker-compose.prod.yaml ps
            echo "[deploy] done"
