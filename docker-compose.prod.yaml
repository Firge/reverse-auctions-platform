services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-owner/reverse-auctions-platform}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - backend/.env
    environment:
      - DB_NAME=${POSTGRES_DB:-catalog}
      - DB_USER=${POSTGRES_USER:-catalog}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-catalog}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-owner/reverse-auctions-platform}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A bidfall worker --loglevel=info
    env_file:
      - backend/.env
    environment:
      - DB_NAME=${POSTGRES_DB:-catalog}
      - DB_USER=${POSTGRES_USER:-catalog}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-catalog}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery_beat:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-owner/reverse-auctions-platform}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A bidfall beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - backend/.env
    environment:
      - DB_NAME=${POSTGRES_DB:-catalog}
      - DB_USER=${POSTGRES_USER:-catalog}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-catalog}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  postfix_relay:
    build:
      context: ./smtp/postfix
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - RELAY_HOST=${SMTP_RELAY_HOST:-smtp.yandex.ru}
      - RELAY_PORT=${SMTP_RELAY_PORT:-587}
      - RELAY_TLS=${SMTP_RELAY_TLS:-encrypt}
      - RELAY_USERNAME=${SMTP_RELAY_USERNAME:-}
      - RELAY_PASSWORD=${SMTP_RELAY_PASSWORD:-}
      - MYHOSTNAME=${SMTP_MYHOSTNAME:-mail.bebra.works}
      - MYNETWORKS=127.0.0.0/8,172.16.0.0/12
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

  email_worker:
    build:
      context: ./smtp/service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_NAME=${POSTGRES_DB:-catalog}
      - DB_USER=${POSTGRES_USER:-catalog}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-catalog}
      - DB_HOST=postgres
      - DB_PORT=5432
      - SMTP_HOST=postfix_relay
      - SMTP_PORT=25
      - SMTP_FROM=${SMTP_FROM:-no-reply@bebra.works}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-45}
      - MAX_RETRY_ATTEMPTS=${MAX_RETRY_ATTEMPTS:-6}
      - RETRY_BASE_SECONDS=${RETRY_BASE_SECONDS:-60}
      - LOOKBACK_DAYS=${LOOKBACK_DAYS:-30}
      - FRONTEND_AUCTION_URL_TEMPLATE=${FRONTEND_AUCTION_URL_TEMPLATE:-https://bebra.works/auctions/{auction_id}}
    depends_on:
      postgres:
        condition: service_healthy
      postfix_relay:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,time,sys;p='/tmp/email_worker_heartbeat';sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 180 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-owner/reverse-auctions-platform}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - web

volumes:
  pgdata:
  redis_data:
